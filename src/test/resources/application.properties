spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration
app.admin.username=admin
app.admin.password=test123
jwt.secret=test-secret-key-long-enough-for-jwt-signing
jwt.expiration=86400000
logging.level.org.springframework.security=DEBUG
# The Flyway migrations are PostgreSQL SQL that H2 cannot run; tests keep ddl-auto=create
# until the test DB moves to Testcontainers PostgreSQL (roadmap 3.5).
spring.flyway.enabled=false
